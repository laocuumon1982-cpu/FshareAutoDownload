# Tự đóng gói bản exe portable mỗi khi tạo Release (tag VD: v6.1) trên GitHub.
# Tool bấm "Cập nhật" sẽ tải file FshareAutoDownload_Portable.zip (bản exe)
# hoặc FshareAutoDownload_vX.Y.zip (bản chạy bằng Python) từ bản phát hành mới nhất.
name: Build release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai thu vien
        run: python -m pip install requests pystray pillow pyinstaller
      - name: Dong goi exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name FshareAutoDownload --icon icon.ico --add-data "icon.ico;." --hidden-import pystray._win32 fshare_auto_idm.py
      - name: Tao file zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force FshareAutoDownload_Portable | Out-Null
          Copy-Item dist/FshareAutoDownload.exe, HUONG_DAN.txt, CHANGELOG.txt, icon.ico FshareAutoDownload_Portable/
          Compress-Archive -Force FshareAutoDownload_Portable FshareAutoDownload_Portable.zip
          New-Item -ItemType Directory -Force FshareAutoDownload | Out-Null
          Copy-Item fshare_auto_idm.py, icon.ico, *.txt, *.bat FshareAutoDownload/
          Compress-Archive -Force FshareAutoDownload "FshareAutoDownload_$v.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FshareAutoDownload_Portable.zip
            FshareAutoDownload_${{ github.ref_name }}.zip
